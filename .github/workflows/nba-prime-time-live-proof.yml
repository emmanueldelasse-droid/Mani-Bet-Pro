name: NBA prime-time live proof

on:
  pull_request:
    paths:
      - 'worker.js'
      - 'scripts/validate-nba-prime-time-live.mjs'
      - '.github/workflows/nba-prime-time-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/nba-prime-time-slate-date-clean-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real ESPN dual-slate and H1 discovery
        run: node scripts/validate-nba-prime-time-live.mjs
